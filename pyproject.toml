[project]
name = "pipeline-video-ia-local"
version = "0.1.0"
description = "Local, free funnel that finds edit-worthy moments in long videos, with a single human approval point."
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP031", "B905"]

[tool.ruff.lint.per-file-ignores]
"montagem/*.py" = ["E402", "I001"]
"estilo/*.py" = ["E402"]
"tests/*.py" = ["E402", "I001"]
